name: CI

# feature -> dev -> main, with the dev -> main PR as the release gate.
# `pull_request` covers both hops; `push` is main-only and deliberately excludes
# dev. In brain-db, dev being both a push trigger and the head of the standing
# dev -> main PR made every merge into dev raise two runs of this workflow on
# one commit — 71 minutes of wall-clock burned across three collisions before it
# was caught.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

# Cancel a superseded PR run; never cancel a push to main, where a half-run
# release check is worse than a slightly stale one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # rustfmt.toml pins style_edition = "2024"; without it rustfmt would read
      # the 2021 language edition from Cargo.toml and reformat the whole crate.
      - name: Format check
        run: cargo fmt --all -- --check

      # The lint set lives in Cargo.toml's `[lints]` so rust-analyzer enforces
      # the same rules; `-D warnings` is what turns them into a gate.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The README's API tables are the human-readable half of the contract
      # `http_manifest.py` emits for the three SDK clients, and nothing
      # connected them. They had drifted to 27 of 62 routes, and one paragraph
      # claimed listing schema versions "is not exposed" while
      # `GET /v1/schemas` was served and brain-mcp was calling it. A missing
      # row is a gap; a documented negative that is false is worse.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: README documents every route
        run: python3 tools/check_readme_routes.py

      # docs.rs is where a reader meets this crate and no job here invoked
      # rustdoc, so nothing could notice when its links rotted — six warnings
      # had accumulated that way, four of them links to private items that
      # render as no link at all. Levels live in Cargo.toml's
      # `[lints.rustdoc]`; this step supplies the invocation, which was the
      # missing half.
      - name: Docs (rustdoc links resolve)
        run: cargo doc --no-deps --all-features

      - name: Test
        run: cargo test --all-targets

      # --locked so a drifting transitive dep fails here rather than in the
      # release image, which builds --locked too.
      - name: Build (release, locked)
        run: cargo build --release --locked --bin brain-edge

      # Nothing audited dependencies. This crate terminates untrusted
      # connections, so a vulnerable transitive is reachable from the public
      # internet by definition. The sibling SDK and MCP repos both gate this;
      # here it was the one missing check.
      #
      # `cargo audit` exits non-zero on a *vulnerability* and only warns on an
      # `unsound`/`unmaintained` advisory, which is the behaviour wanted: the
      # tree currently carries one unsoundness warning (tokio's `AsyncFd::new`
      # I/O-safety advisory) that no released tokio fixes yet, and failing the
      # build on it would mean pinning the gate open from day one.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit

  docker:
    name: Docker image
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build only; publishing is a separate concern.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: brain-edge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the entrypoint actually runs in the slim runtime stage — a shared
      # library the builder had and the runtime doesn't only shows up here, never
      # at compile time. /health/live is the static liveness route, so this needs
      # no Brain behind it; /health/ready would, and would rightly fail.
      - name: Smoke-test the image
        run: |
          docker run -d --name edge -p 8080:8080 brain-edge:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health/live; then
              echo "edge is live"
              docker rm -f edge
              exit 0
            fi
            sleep 1
          done
          echo "::error title=Smoke test failed::/health/live never answered"
          docker logs edge
          docker rm -f edge
          exit 1
